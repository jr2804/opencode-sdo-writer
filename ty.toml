# type checker rules - see https://docs.astral.sh/ty/reference/rules/

[environment]
python-version = "3.13"

[src]
include = [
    "src",
    "tests",
]
# The vendored skill snapshot is third-party content and is not type checked.
exclude = [
    "src/opencode_sdo_writer/_vendor",
]

[terminal]
error-on-warning = true
